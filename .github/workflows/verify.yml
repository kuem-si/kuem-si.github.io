name: Verify

# Build verification for work that is not being deployed: pull requests and
# pushes to any branch other than `main`. Deployment itself is handled by
# deploy-pages.yml, which only runs on `main`.
on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Astro 7.4.2 requires Node >=22.23.4; skip a stale runner-cached 22.x.
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and content check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify output
        run: npm run verify

      - name: Verify canonical page URLs
        run: npm run check:urls

      - name: Verify HTTP directory redirects in development
        run: |
          npm run dev -- --host 127.0.0.1 --port 4321 &
          dev_pid=$!
          trap 'kill "$dev_pid"' EXIT
          npx -y wait-on --timeout 60000 http://127.0.0.1:4321/
          npm run check:urls -- --base http://127.0.0.1:4321

      - name: Format check
        run: npm run format:check

      - name: Serve and Lighthouse audit
        run: |
          npx -y http-server dist -p 4173 --silent &
          npx -y wait-on http://localhost:4173
          # Three runs per page; the gate reads the median run (Lighthouse's
          # own advice for variable hardware). The first run on a cold runner
          # used to report ~1 s of blocking time the page doesn't have.
          for i in 1 2 3; do
            npx -y lighthouse http://localhost:4173/ --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=.lh-home-$i.json --chrome-flags="--headless=new --no-sandbox" --quiet
            npx -y lighthouse http://localhost:4173/en/ --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=.lh-en-$i.json --chrome-flags="--headless=new --no-sandbox" --quiet
          done
          node .tools/lighthouse-assert.mjs .lh-home-1.json,.lh-home-2.json,.lh-home-3.json .lh-en-1.json,.lh-en-2.json,.lh-en-3.json
