name: Verify

# Build verification for work that is not being deployed: pull requests and
# pushes to any branch other than `main`. Deployment itself is handled by
# deploy-pages.yml, which only runs on `main`.
on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and content check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify output
        run: npm run verify

      - name: Format check
        run: npm run format:check
