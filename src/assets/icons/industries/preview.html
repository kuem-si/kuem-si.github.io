<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KUEM CGP – ikone panog</title>
  <style>
    :root { font-family: "Source Sans 3", Arial, sans-serif; color: #253238; background: #E8E6E1; }
    body { margin: 0; padding: 48px; }
    h1 { margin: 0 0 28px; font-family: "Space Grotesk", Arial, sans-serif; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(250px, 1fr)); gap: 16px; max-width: 1120px; }
    .card { display: grid; place-items: center; min-height: 250px; padding: 24px; background: #fff; border: 1px solid rgba(37,50,56,.12); border-radius: 8px; }
    img { width: 176px; height: 144px; }
    span { margin-top: 14px; font-family: "Space Grotesk", Arial, sans-serif; font-weight: 700; font-size: 18px; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { body { padding: 24px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>KUEM CGP – ikone panog</h1>
  <div class="grid">
    <div class="card"><img src="01-komunala-in-energija.svg" alt=""><span>Komunala in energija</span></div>
    <div class="card"><img src="02-javna-infrastruktura.svg" alt=""><span>Javna infrastruktura</span></div>
    <div class="card"><img src="03-okolje.svg" alt=""><span>Okolje</span></div>
    <div class="card"><img src="04-industrija.svg" alt=""><span>Industrija</span></div>
    <div class="card"><img src="05-mobilnost.svg" alt=""><span>Mobilnost</span></div>
    <div class="card"><img src="06-turizem.svg" alt=""><span>Turizem</span></div>
  </div>
</body>
</html>
